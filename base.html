{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WrenchLog{{if .PageTitle}} — {{.PageTitle}}{{end}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0d0f0e;
  --bg2:       #141714;
  --bg3:       #1c201b;
  --border:    #2a2e29;
  --border2:   #374036;
  --accent:    #c8f046;
  --accent2:   #8fb830;
  --text:      #d8dbd5;
  --text2:     #8a9185;
  --text3:     #5a5f56;
  --danger:    #e05555;
  --warn:      #e08820;
  --radius:    4px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 0.95rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Nav ── */
nav {
  background: var(--bg2);
  border-bottom: 2px solid var(--border2);
  padding: 0 1.5rem;
  display: flex;
  align-items: center;
  gap: 2rem;
  height: 54px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-brand {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.nav-brand svg { flex-shrink: 0; }
.nav-links { display: flex; gap: 0.25rem; }
.nav-links a {
  color: var(--text2);
  text-decoration: none;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 0.9rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 0.35rem 0.75rem;
  border-radius: var(--radius);
  transition: color 0.15s, background 0.15s;
}
.nav-links a:hover { color: var(--text); background: var(--bg3); }
.nav-links a.active { color: var(--accent); }

/* ── Layout ── */
main { flex: 1; padding: 2rem 1.5rem; max-width: 1100px; margin: 0 auto; width: 100%; }

/* ── Page header ── */
.page-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 1.75rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  gap: 1rem;
  flex-wrap: wrap;
}
.page-header h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1;
}
.page-header .subtitle {
  font-size: 0.85rem;
  color: var(--text2);
  margin-top: 0.3rem;
  font-family: 'Share Tech Mono', monospace;
}

/* ── Breadcrumb ── */
.breadcrumb {
  font-size: 0.8rem;
  color: var(--text3);
  font-family: 'Share Tech Mono', monospace;
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.breadcrumb a { color: var(--text2); text-decoration: none; }
.breadcrumb a:hover { color: var(--accent); }
.breadcrumb span { color: var(--text3); }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.5rem 1.1rem;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
  border-radius: var(--radius);
  border: none;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, transform 0.1s;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #0d0f0e; }
.btn-primary:hover { background: #d8ff55; }
.btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border2); }
.btn-secondary:hover { background: var(--border2); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-sm { padding: 0.3rem 0.7rem; font-size: 0.8rem; }

/* ── Cards ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.card-header {
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.card-header h2, .card-header h3 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text2);
}
.card-body { padding: 1.25rem; }

/* ── Stat grid ── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent2);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
}
.stat-card .stat-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.7rem;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 0.35rem;
}
.stat-card .stat-value {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 2rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}

/* ── Owner list ── */
.owner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
.owner-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-decoration: none;
  color: inherit;
  display: block;
  padding: 1.25rem;
  transition: border-color 0.15s, transform 0.15s;
  position: relative;
}
.owner-card:hover { border-color: var(--accent2); transform: translateY(-2px); }
.owner-card .owner-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  margin-bottom: 0.4rem;
  text-transform: uppercase;
}
.owner-card .owner-meta {
  font-size: 0.8rem;
  color: var(--text3);
  font-family: 'Share Tech Mono', monospace;
}
.owner-card .owner-count {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 3px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem;
  color: var(--text2);
  padding: 0.2rem 0.5rem;
}

/* ── Vehicle list ── */
.vehicle-list { display: flex; flex-direction: column; gap: 0.75rem; }
.vehicle-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.9rem 1.1rem;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.15s;
}
.vehicle-row:hover { border-color: var(--accent2); }
.vehicle-icon {
  width: 36px; height: 36px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: var(--text2);
}
.vehicle-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  flex: 1;
}
.vehicle-sub {
  font-size: 0.78rem;
  color: var(--text3);
  font-family: 'Share Tech Mono', monospace;
}
.tag {
  display: inline-block;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 2px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem;
  color: var(--text2);
  padding: 0.15rem 0.5rem;
  white-space: nowrap;
}

/* ── Log table ── */
.log-table { width: 100%; border-collapse: collapse; }
.log-table th {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 0.6rem 0.9rem;
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.log-table td {
  padding: 0.8rem 0.9rem;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  font-size: 0.88rem;
}
.log-table tr:last-child td { border-bottom: none; }
.log-table tr:hover td { background: var(--bg3); }
.log-date {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.8rem;
  color: var(--text2);
  white-space: nowrap;
}
.log-mileage {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.85rem;
  color: var(--accent);
  white-space: nowrap;
}
.log-work { font-weight: 500; }
.log-parts { color: var(--text2); font-size: 0.83rem; }
.log-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }

/* ── Forms ── */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
.form-full { grid-column: 1 / -1; }
.form-group { display: flex; flex-direction: column; gap: 0.4rem; }
.form-group label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.form-group input,
.form-group textarea,
.form-group select {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 0.92rem;
  padding: 0.55rem 0.75rem;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  border-color: var(--accent2);
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group select option { background: var(--bg3); }
.form-actions {
  display: flex;
  gap: 0.75rem;
  align-items: center;
  margin-top: 1.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
}

/* ── Delete confirm ── */
.danger-zone {
  margin-top: 2rem;
  padding: 1rem 1.25rem;
  border: 1px solid #3a1a1a;
  border-radius: var(--radius);
  background: #1a0e0e;
}
.danger-zone h3 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--danger);
  margin-bottom: 0.75rem;
}
.danger-zone p { font-size: 0.85rem; color: var(--text3); margin-bottom: 0.75rem; }

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text3);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.85rem;
}
.empty svg { margin-bottom: 1rem; opacity: 0.3; }

/* ── Recent entries (dashboard) ── */
.recent-entry {
  display: flex; gap: 1rem; align-items: flex-start;
  padding: 0.9rem 0;
  border-bottom: 1px solid var(--border);
}
.recent-entry:last-child { border-bottom: none; }
.recent-dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  margin-top: 0.4rem;
  flex-shrink: 0;
}
.recent-meta { font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; color: var(--text3); }
.recent-work { font-size: 0.9rem; font-weight: 500; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── Responsive ── */
@media (max-width: 640px) {
  nav { gap: 1rem; }
  .nav-links a { padding: 0.3rem 0.5rem; font-size: 0.82rem; }
  .log-table th:nth-child(4),
  .log-table td:nth-child(4) { display: none; }
}
</style>
</head>
<body>
<nav>
  <a class="nav-brand" href="/">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
    WrenchLog
  </a>
  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/owners">Owners</a>
  </div>
</nav>
<main>
{{block "content" .}}{{end}}
</main>
</body>
</html>
{{end}}
