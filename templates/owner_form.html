{{template "base" .}}

{{define "content"}}
<div class="breadcrumb">
  <a href="/">Home</a>
  <span>/</span>
  <a href="/owners">Owners</a>
  <span>/</span>
  <span>{{.Title}}</span>
</div>

<div class="page-header">
  <div>
    <h1>{{.Title}}</h1>
  </div>
</div>

<div class="card" style="max-width:680px;">
  <div class="card-header">
    <h2>Owner Details</h2>
  </div>
  <div class="card-body">
    {{if .Owner.ID}}
    <form method="POST" action="/owners/{{.Owner.ID}}/edit">
    {{else}}
    <form method="POST" action="/owners/new">
    {{end}}
      <div class="form-grid">
        <div class="form-group form-full">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" value="{{.Owner.Name}}" required placeholder="John Smith">
        </div>
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" value="{{.Owner.Phone}}" placeholder="(555) 000-0000">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{.Owner.Email}}" placeholder="john@example.com">
        </div>
        <div class="form-group form-full">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" placeholder="Any notes about this owner...">{{.Owner.Notes}}</textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Owner</button>
        {{if .Owner.ID}}
        <a href="/owners/{{.Owner.ID}}" class="btn btn-secondary">Cancel</a>
        {{else}}
        <a href="/owners" class="btn btn-secondary">Cancel</a>
        {{end}}
      </div>
    </form>
  </div>
</div>
{{end}}
{{define "owner_form.html"}}{{template "base" .}}{{end}}
